name: FreeBSD 16 experimental VM smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot-freebsd16:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Install VM utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils cloud-image-utils openssh-client xz-utils

      - name: Download verified official FreeBSD 16 snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vm evidence

          BASE="https://download.freebsd.org/ftp/snapshots/VM-IMAGES/16.0-CURRENT/amd64/Latest"

          curl -fsSL --retry 3 \
            "$BASE/CHECKSUM.SHA256" \
            -o vm/CHECKSUM.SHA256

          python3 - <<'PY'
          import pathlib, re

          data = pathlib.Path("vm/CHECKSUM.SHA256").read_text()
          matches = re.findall(
              r"^SHA256 \((FreeBSD-16\.0-CURRENT-amd64-BASIC-CLOUDINIT-[^)]+-ufs\.qcow2\.xz)\) = ([0-9a-fA-F]{64})$",
              data,
              re.MULTILINE,
          )

          if len(matches) != 1:
              raise SystemExit(f"Expected exactly one UFS cloud image, found {len(matches)}")

          filename, digest = matches[0]
          pathlib.Path("vm/image-name.txt").write_text(filename)
          pathlib.Path("vm/expected-sha256.txt").write_text(digest.lower())
          print("Selected verified image:", filename)
          PY

          IMAGE="$(cat vm/image-name.txt)"

          curl -fsSL --retry 3 \
          "$BASE/FreeBSD-16.0-CURRENT-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz" \
          -o "vm/$IMAGE"

          python3 - <<'PY'
          import hashlib, pathlib

          name = pathlib.Path("vm/image-name.txt").read_text()
          expected = pathlib.Path("vm/expected-sha256.txt").read_text()
          with open(pathlib.Path("vm") / name, "rb") as f:
              actual = hashlib.file_digest(f, "sha256").hexdigest()

          if actual != expected:
              raise SystemExit("SHA256 verification failed")

          print("SHA256 verification successful")
          pathlib.Path("evidence/image-sha256.txt").write_text(
              f"{name}  {actual}\n"
          )
          PY

          xz -d "vm/$IMAGE"

          qemu-img info vm/*.qcow2 | tee evidence/image-info.txt

      - name: Create temporary cloud-init SSH credentials
        shell: bash
        run: |
          set -euo pipefail
          ssh-keygen -q -t ed25519 -N '' -f vm/ephemeral_key
          PUBKEY="$(cat vm/ephemeral_key.pub)"
          cat > vm/user-data <<EOF
          #cloud-config
          package_update: false
          package_upgrade: false
          users:
            - default
            - name: fypbuild
              shell: /bin/sh
              groups: wheel
              sudo: ALL=(ALL) NOPASSWD:ALL
              ssh_authorized_keys:
                - $PUBKEY
          ssh_pwauth: false
          disable_root: true
          EOF
          printf 'instance-id: fyp-freebsd16-smoke-1\nlocal-hostname: fyp-freebsd16\n' > vm/meta-data
          cloud-localds vm/seed.iso vm/user-data vm/meta-data

      - name: Boot FreeBSD 16 and verify SSH
        shell: bash
        run: |
          set -euo pipefail
          qemu-system-x86_64 \
            -machine accel=tcg -cpu max -smp 2 -m 2048 \
            -drive file="$(echo vm/*.qcow2)",if=virtio,format=qcow2 \
            -drive file=vm/seed.iso,media=cdrom,readonly=on \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:10022-:22 \
            -device virtio-net-pci,netdev=net0 \
            -display none -serial file:evidence/guest-console.log \
            -monitor none -daemonize
          success=0
          for attempt in $(seq 1 90); do
            if ssh -i vm/ephemeral_key -p 10022 -o StrictHostKeyChecking=no \
               -o UserKnownHostsFile=/dev/null -o ConnectTimeout=3 \
               fypbuild@127.0.0.1 'freebsd-version -kru; uname -a' \
               > evidence/guest-version.txt 2> evidence/ssh-last-error.txt; then
              success=1
              break
            fi
            sleep 5
          done
          echo '=== Guest version ==='
          cat evidence/guest-version.txt 2>/dev/null || true
          echo '=== Console tail ==='
          tail -n 50 evidence/guest-console.log || true
          if [ "$success" -ne 1 ]; then
            echo 'FreeBSD 16 guest did not become SSH-accessible; inspect uploaded evidence.' >&2
            exit 1
          fi

      - name: Upload non-sensitive diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freebsd16-smoke-test-evidence
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
